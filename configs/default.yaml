# configs/default.yaml
data:
  data_dir: "./data/BraTS2021"
  patch_size: [96, 96, 96]
  batch_size: 2
  num_workers: 4

model:
  img_size: [96, 96, 96]
  in_channels: 4
  out_channels: 4  # background, necrotic, edema, enhancing
  embed_dim: 96
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  text_embed_dim: 256
  text_max_len: 128

loss:
  dice_weight: 1.0
  ce_weight: 1.0
  edge_weight: 1.0
  contrastive_weight: 0.5
  temperature: 0.07

training:
  epochs: 300
  lr: 1e-4
  weight_decay: 1e-5
  warmup_epochs: 10

eval:
  metrics: ["dice", "hd95", "assd"]
