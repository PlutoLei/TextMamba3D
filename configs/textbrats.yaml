# configs/textbrats.yaml
# TextBraTS Configuration - 使用专家标注文本，无信息泄露

data:
  # TextBraTS + BraTS2020 数据路径
  data_dir: "./data/BraTS2020/BraTS2020_TrainingData/MICCAI_BraTS2020_TrainingData"
  dataset_type: "textbrats"  # 使用 TextBraTS 数据加载器
  patch_size: [64, 64, 64]  # 减小以节省内存 (8GB RAM)
  batch_size: 1
  num_workers: 0  # 避免 WSL 多进程问题
  # 原论文 split: 220 train / 55 val / 94 test (total 369)
  train_ratio: 0.596  # 220/369 ≈ 59.6%
  val_ratio: 0.149    # 55/369 ≈ 14.9%, 剩余 94 为 test

model:
  img_size: [64, 64, 64]  # 与 patch_size 一致
  in_channels: 4          # T1, T1ce, T2, FLAIR
  out_channels: 4         # background, necrotic, edema, enhancing
  embed_dim: 48
  depths: [2, 2, 2, 2]
  dropout: 0.1
  text_embed_dim: 256
  text_max_len: 256       # 增加文本长度以容纳专家描述
  use_pretrained_text: true    # Use PubMedBERT pretrained text encoder
  unfreeze_text_layers: 0      # Keep PubMedBERT frozen for stability
  text_model_path: "./pretrained/pubmedbert"  # Local path; set to null to download from HuggingFace

loss:
  dice_weight: 1.0
  ce_weight: 1.0
  edge_weight: 1.0
  # 关闭对比学习 (batch_size=1 时无效)
  contrastive_weight: 0.0
  temperature: 0.07
  # BraTS class weights: [background, necrotic, edema, enhancing]
  class_weights: [0.25, 3.0, 1.0, 4.0]

augmentation:
  use_elastic: true             # Elastic deformation for small dataset
  use_modality_dropout: true    # Modality dropout prevents single-modality overfitting

training:
  epochs: 300
  lr: 0.00005  # 5e-5, 从 1e-4 降低以配合小模型 + 小数据集
  weight_decay: 0.05
  warmup_epochs: 10
  patience: 50                  # More patience for larger dataset convergence
  gradient_accumulation: 4
  gradient_checkpointing: true  # Save ~30-50% GPU memory
  deep_supervision: true       # Aux heads at intermediate decoder stages
  use_amp: false
  no_text_ratio: 0.15           # 15% text-free training for robustness
  gradient_clip_norm: 1.0

eval:
  metrics: ["dice", "hd95"]

# 实验记录
experiment:
  name: "TextMamba3D_TextBraTS"
  description: "TextMamba3D v2: embed_dim=48, lr=5e-5, 220/55/94 split, manual warmup+cosine LR, gradient clipping"
